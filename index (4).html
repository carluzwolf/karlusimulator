<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Karlu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{width:100%;height:64px;position:relative;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-shrink:0;flex-shrink:0}
#logo{height:38px;width:auto}
#burger{position:absolute;left:12px;top:10px;width:44px;height:44px;background:none;border:0;padding:12px 10px}
#burger i{display:block;height:2px;background:#fff;margin:5px 0;border-radius:2px;opacity:.85}
#stage{-webkit-flex:1;flex:1;width:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;min-height:0}
#bezel{width:min(86vw,60vh,520px);height:min(86vw,60vh,520px);border-radius:50%;padding:3.5%;background:#111;box-shadow:0 0 0 2px #222,0 0 40px rgba(255,20,147,.18)}
#scr{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block}
#pw{margin-top:22px;width:58px;height:58px;border-radius:50%;border:2px solid #444;background:#0a0a0a;position:relative}
#pw:after{content:"";position:absolute;left:50%;top:15px;width:2px;height:12px;margin-left:-1px;background:#888;border-radius:2px}
#pw:before{content:"";position:absolute;left:15px;top:15px;width:22px;height:22px;border:2px solid #888;border-top-color:transparent;border-radius:50%}
#pw.on{border-color:#ff1493;box-shadow:0 0 16px #ff1493}
#pw.on:before{border-color:#ff1493;border-top-color:transparent}#pw.on:after{background:#ff1493}
#pn{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);background:#0b0b0b;border-right:1px solid #222;-webkit-transform:translateX(-105%);transform:translateX(-105%);-webkit-transition:-webkit-transform .25s;transition:transform .25s;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) 16px 30px}
#pn.open{-webkit-transform:none;transform:none}
#sh{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:4}
h2{font-size:15px;letter-spacing:2px;color:#ff1493;margin:4px 0 12px}
h3{font-size:12px;letter-spacing:1px;color:#999;margin:20px 0 8px;text-transform:uppercase}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid #1a1a1a}
.sw{width:46px;height:26px;border-radius:13px;background:#333;position:relative;border:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;-webkit-transition:left .15s;transition:left .15s}
.sw.on{background:#ff1493}.sw.on:after{left:23px}
.g{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:6px}
.g button{border:1px solid #2a2a2a;background:#151515;color:#fff;border-radius:8px;padding:8px 10px;font-size:13px}
.g button:active{background:#ff1493}
.f{width:34px;height:34px;border-radius:50%;padding:0!important;border:2px solid #222!important}
.f.sel{border-color:#fff!important}
.bt{display:block;width:100%;margin-top:10px;padding:11px;border-radius:8px;border:1px solid #333;background:#151515;color:#fff;font-size:14px}
#err{position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;font-size:12px;padding:6px 10px;z-index:9;display:none;white-space:pre-wrap}
#hint{position:absolute;color:#666;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
 <div id="top"><button id="burger" aria-label="Menu"><i></i><i></i><i></i></button><img id="logo" src="logo.png" alt="Starlyn Infinite"></div>
 <div id="stage">
  <div id="bezel"><div id="scr"><canvas id="cv" width="480" height="480"></canvas></div></div>
  <button id="pw" aria-label="Power"></button>
 </div>
</div>
<div id="sh"></div>
<div id="pn">
 <h2>KARLU · CONFIGURAÇÕES</h2><div style="font-size:11px;color:#666;margin:-8px 0 8px">versão 7 (se não aparecer, limpe o cache)</div>
 <div class="row"><span>Travar rosto atual</span><button class="sw" id="tLock"></button></div>
 <div class="row"><span>Reações automáticas</span><button class="sw on" id="tAuto"></button></div>
 <div class="row"><span>Troca de rosto automática</span><button class="sw on" id="tMorph"></button></div>
 <div class="row"><span>Microfone (reage ao som)</span><button class="sw" id="tMic"></button></div>
 <div class="row"><span>Câmera (gestos)</span><button class="sw" id="tCam"></button></div>
 <div class="row"><span>Comandos de voz (falar com ele)</span><button class="sw" id="tVoz"></button></div>
 <div class="row"><span>Giroscópio (inclinar e balançar)</span><button class="sw" id="tMot"></button></div>
 <div id="dbg" style="font-size:12px;color:#ff1493;padding:2px 0"></div>
 <div id="heard" style="font-size:12px;color:#7fd;padding:2px 0"></div>
 <div id="st" style="font-size:12px;color:#888;padding:6px 0"></div>
 <h3>Reações (toque para rodar)</h3><div class="g" id="gR"></div>
 <h3>Olhos / Rostos (76)</h3><div class="g" id="gF"></div>
 <button class="bt" id="bBoot">Reiniciar animação de abertura</button>
</div>
<div id="err"></div>
<video id="vd" playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none"></video>
<script>
function showErr(m){try{var e=document.getElementById('err');e.style.display='block';e.textContent+=m+'\n'}catch(x){}}
window.onerror=function(m,u,l){showErr('Erro: '+m+' (linha '+l+')')};
</script>
<script type="text/plain" id="ext">
/* ---------- microfone e camera ---------- */
var st=document.getElementById('st');
function say(t){st.textContent=t}
function fire(nm,force){if(P.phase!='run')return false;if(act&&!force)return false;for(var i=0;i<R.length;i++)if(R[i].n.indexOf(nm)==0){startAct(i);return true}return false}
var AC,an,buf,micOn=false,micS,mbase=6,lastL=0,lastT=0;
var talkC=0;
function micLoop(){
 if(!micOn)return;setTimeout(micLoop,60);
 if(vOn)return;                       // com comandos de voz ligados, o microfone de barulho fica quieto
 an.getByteTimeDomainData(buf);
 var m=0,i,d;for(i=0;i<buf.length;i++){d=Math.abs(buf[i]-128);if(d>m)m=d}
 var n=now();mbase+=(Math.min(m,30)-mbase)*.02;
 if(m>118&&m-mbase>85){talkC=0;                       // so palma/batida BEM forte

  else{lastL=n;setTimeout(function(){if(lastL&&now()-lastL>=700){lastL=0;fire('Susto',true)}},750)}return}
 if(m>mbase+40)talkC++;else talkC=0;                  // falar so chama atencao se for alto e continuo
 if(talkC>=10&&n-lastT>20000){talkC=0;if(fire('Curioso'))lastT=n}}
function micStart(cb){
 var md=navigator.mediaDevices;if(!md||!md.getUserMedia){cb(false);return}
 md.getUserMedia({audio:true}).then(function(s){micS=s;AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();

function micStop(){micOn=false;if(micS){micS.getTracks().forEach(function(t){t.stop()})}}
var tm=document.getElementById('tMic');
tm.onclick=function(){if(micOn){micStop();tm.className='sw';say('Microfone desligado');return}
 say('Pedindo permissão do microfone...');micStart(function(ok){tm.className='sw'+(ok?' on':'');say(ok?'Microfone ligado: fale, bata palmas (2 = cambalhota).':'Microfone negado ou indisponível (precisa HTTPS e permissão).')})};
// camera: MediaPipe Hands (carrega da internet; precisa de aparelho recente)
var camOn=false,hands,vd=document.getElementById('vd'),camS,lastG=0;
function ld(src,cb,er){var e=document.createElement('script');e.src=src;e.crossOrigin='anonymous';e.onload=cb;e.onerror=er;document.head.appendChild(e)}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}

 var H=res.multiHandLandmarks||[],i;if(!H.length)return '';
 if(H.length==2){var a=H[0],b=H[1];if(dist(a[4],b[4])<.07&&dist(a[8],b[8])<.09)return 'heart'}
 for(i=0;i<H.length;i++){var L=H[i],sc=dist(L[0],L[9]),i1=ext(L,8,6),m1=ext(L,12,10),r1=ext(L,16,14),p1=ext(L,20,18),th=dist(L[4],L[2])>sc*.55;

function camStop(){camOn=false;if(camS){camS.getTracks().forEach(function(t){t.stop()});camS=null}}
function camStart(cb){
 var md=navigator.mediaDevices,done=false,vd=document.getElementById('vd');
 if(!md||!md.getUserMedia){cb(false,'Este navegador não libera a câmera (precisa abrir por https).');return}
 var wd=setTimeout(function(){if(!done){done=true;cb(false,'A câmera não respondeu. Feche outros apps/abas que usam a câmera e tente de novo.')}},30000);
 function ok(st){if(done){st.getTracks().forEach(function(t){t.stop()});return}done=true;clearTimeout(wd);
  try{camS=st;vd.setAttribute('playsinline','');vd.setAttribute('webkit-playsinline','');vd.muted=true;vd.srcObject=st;
   var pl=vd.play();if(pl&&pl.catch)pl.catch(function(){});
   say('Câmera ok. Baixando reconhecimento de mão...');loadHands(0,cb)}catch(e){cb(false,'Erro ao abrir o vídeo: '+(e&&e.message||e))}}

  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});hands.onResults(onHands);

var TR=0,TG=0,DZ=0,tgT=0,P={on:false,phase:'off',pt:0},blinkAt=0,blink=-1,gx=0,gy=0,tgx=0,tgy=0,gAt=0,actAt=0,morphAt=0,smoke=0,smokeT=0;
var S={lock:false,auto:true,morph:true},seq=[],tick=0;

function V(){return {sy:1,arc:0,cT:0,cB:0,sc:1,rot:0,dx:0,dy:0,zoom:1,ro:0,ps:1,sh:'',tint:null,wl:0,wr:0,cvg:0,rb:0}}

function envl(t,d){return Math.min(ease(t/350),ease((d-t)/350))}

function compute(){
 var v=V(),n=now();
 if(blink>=0){var b=(n-blink)/180;if(b>=1){blink=-1}else v.sy=1-.96*Math.sin(Math.PI*b)}
 if(n>blinkAt&&blink<0&&!act){blink=n;blinkAt=n+rnd(2300,4300);if(Math.random()<.2)blinkAt=n+260}
 if(n>gAt){gAt=n+rnd(900,2600);tgx=rnd(-5,5);tgy=rnd(-4,4);if(Math.random()<.4){tgx=0;tgy=0}}
 var gxT=tgx,gyT=tgy;
 if(act){var t=n-t0,a=act;
  if(t>a.d){act=null;actAt=n+rnd(40000,60000)}
  else{var e=envl(t,a.d),tt=t/1000;
   if(a.arc){v.arc=e;v.bend=a.arc}
   if(a.cT)v.cT=a.cT*e;if(a.cB)v.cB=a.cB*e;if(a.sc)v.sc=1+(a.sc-1)*e;if(a.rot)v.rot=a.rot*e;
   if(a.ps)v.ps=1+(a.ps-1)*e;if(a.sh){v.sh=a.sh}if(a.tint)v.tint=[a.tint[0],a.tint[1],a.tint[2],a.tint[3]*e];
   if(a.gx!=null||a.gy!=null){gxT=(a.gx||0)*e+tgx*(1-e);gyT=(a.gy||0)*e+tgy*(1-e)}
   if(a.gm=='circle'){gxT=Math.cos(tt*7)*9*e;gyT=Math.sin(tt*7)*9*e}
   if(a.gm=='scan'){gxT=Math.sin(tt*5)*10*e;gyT=0}
   if(a.cv)v.cvg=e;if(a.rb)v.rb=e;
   if(a.wink)v.wr=e;
   var m=a.m;
   if(m=='shake')v.dx=Math.sin(tt*28)*10*e;
   if(m=='nod')v.dy=Math.sin(tt*3.2)*8*e;
   if(m=='tilt')v.ro=12*e;
   if(m=='bounce')v.dy=-Math.abs(Math.sin(tt*6))*12*e;
   if(m=='spin')v.ro=360*ease(t/a.d);
   if(m=='zoom')v.zoom=1+.12*Math.sin(Math.PI*t/a.d);
   if(m=='trem'){v.dx=Math.sin(tt*50)*3*e}
   if(m=='sway')v.ro=Math.sin(tt*4)*8*e;
  }}
 v.ro+=TR;gxT+=TG;if(DZ>.02){v.dx+=Math.sin(n/45)*DZ*4;v.dy+=Math.cos(n/60)*DZ*3;if(DZ>.8)v.sh='spiral'}
 gx+=(gxT-gx)*.18;gy+=(gyT-gy)*.18;
 v.gx=gx;v.gy=gy;return v}

/* ---------- desenho ---------- */
function pupil(side,v,pc){
 var cx=-side*9+v.gx-side*v.cvg*10,cy=11.5+v.gy,ps=v.ps,rx=16*ps,ry=20.5*ps,i;
 x.save();x.translate(cx,cy);x.rotate(side*-8*D);x.fillStyle=pc;
 if(v.sh=='heart'){x.beginPath();x.moveTo(0,ry*.9);x.bezierCurveTo(-rx*1.7,-ry*.1,-rx*.7,-ry*1.1,0,-ry*.35);x.bezierCurveTo(rx*.7,-ry*1.1,rx*1.7,-ry*.1,0,ry*.9);x.fillStyle='#ff2d6f';x.fill()}
 else if(v.sh=='star'){x.beginPath();for(i=0;i<10;i++){var r=i%2?ry*.45:ry*1.05,a=-Math.PI/2+i*Math.PI/5;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fillStyle='#fff';x.fill()}
 else if(v.sh=='dollar'){x.font='bold '+Math.round(ry*2.1)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText('$',0,2)}
 else if(v.sh=='spiral'){x.lineWidth=3;x.strokeStyle='#000';x.beginPath();var q=now()/200;for(i=0;i<60;i++){var a2=i*.35+q,r2=i*.45;x.lineTo(Math.cos(a2)*r2,Math.sin(a2)*r2)}x.stroke()}
 else if(flower){for(i=0;i<5;i++){x.save();x.rotate(i*72*D);x.beginPath();x.save();x.translate(0,-ry*.55);x.scale(rx*.5,ry*.55);x.arc(0,0,1,0,6.3);x.restore();x.fill();x.restore()}x.fillStyle='rgb(255,112,177)';x.beginPath();x.arc(0,0,rx*.38,0,6.3);x.fill()}
 else{x.beginPath();x.save();x.scale(rx,ry);x.arc(0,0,1,0,6.3);x.restore();x.fill()}
 x.restore()}
function eye(side,v,k,hue){
 var c=cur.c,eo=k*6,col,pcol;
 if(hue!=null){col='hsl('+(hue|0)+',100%,60%)';pcol='#fff'}else{col=rgb(c,eo);pcol=rgb(c,eo+3)}
 var cx=120+side*GAP+side*(v.sc-1)*RX*.35+v.dx,cyy=CY+v.dy,wk=k?v.wr:0,sq=Math.max(1-v.sy,wk);
 var sy=(1-sq*.96)*(1-.94*v.arc),rot=side*15*(1-.75*v.arc),rx=RX*v.sc,ry=RY*v.sc;
 x.save();x.translate(cx,cyy+RY*sq*.12);x.rotate(rot*D);
 if(v.arc>.55){var bd=(v.bend||-1)*9,w=RX*.95;x.strokeStyle=col;x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(-w,0);x.quadraticCurveTo(0,bd*-2.2,w,0);x.stroke();x.restore();return}
 var fill=col;
 if(cur.ga>.02&&hue==null){var g=x.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,col);g.addColorStop(1,'rgb('+(cur.gb[0]|0)+','+(cur.gb[1]|0)+','+(cur.gb[2]|0)+')');fill=g}
 x.save();x.scale(1,sy);
 x.beginPath();x.save();x.scale(rx,ry);x.arc(0,0,1,0,6.3);x.restore();x.clip();
 if(v.cT>0||v.cB>0){x.beginPath();x.rect(-rx*2,-ry+2*ry*v.cT,rx*4,2*ry*(1-v.cT-v.cB));x.clip()}
 x.fillStyle=fill;x.fillRect(-rx*2,-ry*2,rx*4,ry*4);
 var tn=v.tint;
 if(tn&&tn[3]>0){x.globalAlpha=tn[3];x.fillStyle='rgb('+tn[0]+','+tn[1]+','+tn[2]+')';x.fillRect(-rx*2,-ry*2,rx*4,ry*4);x.globalAlpha=1}
 pupil(side,v,pcol);
 x.restore();x.restore()}

function deco(v){
 if(!act||!act.deco)return;var t=(now()-t0)/1000,e=envl(now()-t0,act.d),d=act.deco,i,p;x.save();x.globalAlpha=e;
 if(d=='heart'){x.fillStyle='#ff2d6f';for(i=0;i<5;i++){p=((t*.5+i*.2)%1);hh(30+i*45+Math.sin(t*3+i)*8,190-p*170,5+i%2*4)}}
 if(d=='spark'){x.fillStyle='#fff';for(i=0;i<7;i++){var a=(Math.sin(t*5+i*2)+1)/2;x.globalAlpha=e*a;starP(30+(i*67)%190,30+(i*53)%170,3+i%3*2)}}
 if(d=='tear'||d=='tear2'){x.fillStyle='#6cf';for(i=0;i<2;i++){p=((t*.7+i*.5)%1);var tx=120+(i?1:-1)*60;x.beginPath();x.arc(tx,125+p*80,5,0,6.3);x.fill()}}
 if(d=='z'){x.fillStyle='#fff';x.font='bold 22px Arial';for(i=0;i<3;i++){p=((t*.35+i*.33)%1);x.globalAlpha=e*(1-p);x.fillText('Z',150+p*40+i*6,80-p*50)}}
 if(d=='sweat'){x.fillStyle='#8df';p=(t*.6)%1;x.beginPath();x.arc(190,60+p*70,6,0,6.3);x.fill()}
 if(d=='bulb'){x.strokeStyle='#ffe14a';x.fillStyle='#ffe14a';x.lineWidth=3;x.beginPath();x.arc(120,38,12,0,6.3);x.fill();for(i=0;i<8;i++){var a2=i*45*D;x.beginPath();x.moveTo(120+Math.cos(a2)*18,38+Math.sin(a2)*18);x.lineTo(120+Math.cos(a2)*26,38+Math.sin(a2)*26);x.stroke()}}
 if(d=='scan'){x.fillStyle='rgba(255,255,255,.35)';var yy=((t*.6)%1)*240;x.fillRect(0,yy,240,5)}
 if(d=='bang'){x.fillStyle='#fff';x.font='bold 40px Arial';x.textAlign='center';x.fillText('!',120,50)}
 if(d=='dots'){x.fillStyle='#fff';for(i=0;i<3;i++){x.globalAlpha=e*((Math.floor(t*2)%4)>i?1:.2);x.beginPath();x.arc(100+i*20,205,4,0,6.3);x.fill()}}
 x.restore()}
function hh(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s);x.bezierCurveTo(cx-s*2,cy-s*.2,cx-s*.8,cy-s*1.4,cx,cy-s*.4);x.bezierCurveTo(cx+s*.8,cy-s*1.4,cx+s*2,cy-s*.2,cx,cy+s);x.fill()}
function starP(cx,cy,s){x.beginPath();for(var i=0;i<8;i++){var r=i%2?s*.4:s*1.6,a=i*Math.PI/4;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.fill()}

function drawFace(v,ox,hue){
 x.save();x.translate(120+ox,118);x.rotate(v.ro*D);x.scale(v.zoom,v.zoom);x.translate(-120,-118);
 eye(-1,v,0,hue);eye(1,v,1,hue);x.restore()}
function smokeDraw(){
 if(!smoke)return;var p=(now()-smokeT)/900;if(p>=1){smoke=0;return}
 for(var i=0;i<9;i++){var a=i*40*D,r=20+p*80;x.globalAlpha=(1-p)*.7;x.fillStyle='#bbb';x.beginPath();x.arc(120+Math.cos(a)*r*.8,118+Math.sin(a)*r*.8,18+p*22,0,6.3);x.fill()}x.globalAlpha=1}

/* ---------- abertura ---------- */
var img=new Image();img.src='logo_display.png';
var bs=0;
function boot(){P.phase='logo';P.pt=now();seq=[];for(var i=0;i<16;i++)seq.push(ri(N));P.tgt=ri(N);seq[15]=P.tgt;act=null}
function bootDraw(){
 var t=now()-P.pt;
 if(P.phase=='logo'){
  x.fillStyle='#fff';x.fillRect(0,0,240,240);
  var a=t<1300?t/1300:(t<6300?1:(t<7600?1-(t-6300)/1300:0));
  if(img.complete&&img.naturalWidth){var w=170,h=w*img.naturalHeight/img.naturalWidth;x.globalAlpha=a;x.drawImage(img,120-w/2,120-h/2,w,h);x.globalAlpha=1}
  if(t>7800){P.phase='ball';P.pt=now()}return}
 if(P.phase=='ball'){
  x.fillStyle='#fff';x.fillRect(0,0,240,240);
  var T=t/1000,r=6+Math.pow(T/3.4,2.2)*190,bx=120+Math.sin(T*4.2)*(95-Math.min(r,95)*.5),by=Math.abs(Math.cos(T*3.6))*(1-T/3.6)*180+Math.min(r,120)*.4+10;
  if(T>3.1){bx=120;by=120}
  x.fillStyle='#000';x.beginPath();x.arc(bx,by,r,0,6.3);x.fill();
  if(t>3700){P.phase='roul';P.pt=now()}return}
 if(P.phase=='roul'){
  x.fillStyle='#000';x.fillRect(0,0,240,240);
  var d=2800,pp=1-Math.pow(1-Math.min(t/d,1),3),pos=pp*15,k=Math.floor(pos),fr=pos-k;
  if(k>=15){k=14;fr=1}
  var save=cur.c.slice(),v=V();
  cur.c=F[seq[k]].slice();cur.ga=0;drawFace(v,fr*240,null);
  cur.c=F[seq[k+1]].slice();drawFace(v,fr*240-240,null);
  cur.c=save;
  if(t>d+300){setFace(P.tgt,true);P.phase='run';blinkAt=now()+2500;actAt=now()+rnd(12000,20000);morphAt=now()+rnd(60000,180000);drawRun();}
  return}}
function drawRun(){
 stepCol();var v=compute();x.fillStyle='#000';x.fillRect(0,0,240,240);
 var hue=null;if(act&&act.rb){hue=(now()/6)%360}
 drawFace(v,0,hue);deco(v);smokeDraw();
 var n=now();
 if(S.auto&&!act&&n>actAt){startAct(ri(R.length))}
 if(S.morph&&!S.lock&&!act&&n>morphAt){var nf;do{nf=ri(N)}while(nf==face);smoke=1;smokeT=n;setTimeout(function(){setFace(nf,false)},350);morphAt=n+rnd(60000,180000)}}

function loop(){
 requestAnimationFrame(loop);
 if(!P.on){return}
 tick++;x.setTransform(2,0,0,2,0,0);
 if(P.phase=='run')drawRun();else bootDraw()}

/* ---------- UI ---------- */
var pw=document.getElementById('pw'),hint;
function power(on){
 P.on=on;pw.className=on?'on':'';x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,480,480);
 if(on){boot()}else{P.phase='off'}}
pw.onclick=function(){power(!P.on)};
var pn=document.getElementById('pn'),sh=document.getElementById('sh');
function menu(o){pn.className=o?'open':'';sh.style.display=o?'block':'none'}
document.getElementById('burger').onclick=function(){menu(true)};sh.onclick=function(){menu(false)};
function tg(id,k,cb){var b=document.getElementById(id);b.onclick=function(){S[k]=!S[k];b.className='sw'+(S[k]?' on':'');if(cb)cb()}}
tg('tLock','lock');tg('tAuto','auto');tg('tMorph','morph');
document.getElementById('bBoot').onclick=function(){if(!P.on)power(true);else boot();menu(false)};
var gF=document.getElementById('gF'),sel=null;
R.forEach(function(r,i){var b=document.createElement('button');b.textContent=r.n;b.onclick=function(){if(P.phase!='run'){return}startAct(i);menu(false)};gR.appendChild(b)});
for(var i=0;i<N;i++)(function(i){var b=document.createElement('button'),r=F[i];b.className='f';b.title='Rosto '+(i+1);
 var a='rgb('+r[0]+','+r[1]+','+r[2]+')',c='rgb('+r[6]+','+r[7]+','+r[8]+')';b.style.background='linear-gradient(90deg,'+a+' 50%,'+c+' 50%)';
 b.onclick=function(){if(P.phase!='run')return;if(sel)sel.className='f';b.className='f sel';sel=b;smoke=1;smokeT=now();setFace(i,false)};gF.appendChild(b)})(i);

try{eval(document.getElementById('ext').text)}catch(e){showErr('Módulo extra falhou: '+(e&&e.message||e))}
setFace(0,true);
x.fillStyle='#000';x.fillRect(0,0,480,480);
loop();
power(true);
})();
</script>
