#pw:after{content:"";position:absolute;left:50%;top:15px;width:2px;height:12px;margin-left:-1px;background:#888;border-radius:2px}

.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;-webkit-transition:left .15s;transition:left .15s}
.sw.on{background:#ff1493}.sw.on:after{left:23px}

 if(!act||!act.deco)return;var t=(now()-t0)/1000,e=envl(now()-t0,act.d),d=act.deco,i,p;x.save();x.globalAlpha=e;
 if(d=='heart'){x.fillStyle='#ff2d6f';for(i=0;i<5;i++){p=((t*.5+i*.2)%1);hh(30+i*45+Math.sin(t*3+i)*8,190-p*170,5+i%2*4)}}
 if(d=='spark'){x.fillStyle='#fff';for(i=0;i<7;i++){var a=(Math.sin(t*5+i*2)+1)/2;x.globalAlpha=e*a;st(30+(i*67)%190,30+(i*53)%170,3+i%3*2)}}
 if(d=='tear'||d=='tear2'){x.fillStyle='#6cf';for(i=0;i<2;i++){p=((t*.7+i*.5)%1);var tx=120+(i?1:-1)*60;x.beginPath();x.arc(tx,125+p*80,5,0,6.3);x.fill()}}
 if(d=='z'){x.fillStyle='#fff';x.font='bold 22px Arial';for(i=0;i<3;i++){p=((t*.35+i*.33)%1);x.globalAlpha=e*(1-p);x.fillText('Z',150+p*40+i*6,80-p*50)}}
 if(d=='sweat'){x.fillStyle='#8df';p=(t*.6)%1;x.beginPath();x.arc(190,60+p*70,6,0,6.3);x.fill()}
 if(d=='bulb'){x.strokeStyle='#ffe14a';x.fillStyle='#ffe14a';x.lineWidth=3;x.beginPath();x.arc(120,38,12,0,6.3);x.fill();for(i=0;i<8;i++){var a2=i*45*D;x.beginPath();x.moveTo(120+Math.cos(a2)*18,38+Math.sin(a2)*18);x.lineTo(120+Math.cos(a2)*26,38+Math.sin(a2)*26);x.stroke()}}
 if(d=='scan'){x.fillStyle='rgba(255,255,255,.35)';var yy=((t*.6)%1)*240;x.fillRect(0,yy,240,5)}
 if(d=='bang'){x.fillStyle='#fff';x.font='bold 40px Arial';x.textAlign='center';x.fillText('!',120,50)}
 if(d=='dots'){x.fillStyle='#fff';for(i=0;i<3;i++){x.globalAlpha=e*((Math.floor(t*2)%4)>i?1:.2);x.beginPath();x.arc(100+i*20,205,4,0,6.3);x.fill()}}
 x.restore()}
function hh(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s);x.bezierCurveTo(cx-s*2,cy-s*.2,cx-s*.8,cy-s*1.4,cx,cy-s*.4);x.bezierCurveTo(cx+s*.8,cy-s*1.4,cx+s*2,cy-s*.2,cx,cy+s);x.fill()}
function st(cx,cy,s){x.beginPath();for(var i=0;i<8;i++){var r=i%2?s*.4:s*1.6,a=i*Math.PI/4;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.fill()}

function drawFace(v,ox,hue){
 x.save();x.translate(120+ox,118);x.rotate(v.ro*D);x.scale(v.zoom,v.zoom);x.translate(-120,-118);
 eye(-1,v,0,hue);eye(1,v,1,hue);x.restore()}
function smokeDraw(){
 if(!smoke)return;var p=(now()-smokeT)/900;if(p>=1){smoke=0;return}
 for(var i=0;i<9;i++){var a=i*40*D,r=20+p*80;x.globalAlpha=(1-p)*.7;x.fillStyle='#bbb';x.beginPath();x.arc(120+Math.cos(a)*r*.8,118+Math.sin(a)*r*.8,18+p*22,0,6.3);x.fill()}x.globalAlpha=1}

/* ---------- abertura ---------- */
var img=new Image();img.src='logo_display.png';
var bs=0;
function boot(){P.phase='logo';P.pt=now();seq=[];for(var i=0;i<16;i++)seq.push(ri(N));P.tgt=ri(N);seq[15]=P.tgt;act=null}
function bootDraw(){
 var t=now()-P.pt;
 if(P.phase=='logo'){
  x.fillStyle='#fff';x.fillRect(0,0,240,240);
  var a=t<1300?t/1300:(t<6300?1:(t<7600?1-(t-6300)/1300:0));
  if(img.complete&&img.naturalWidth){var w=170,h=w*img.naturalHeight/img.naturalWidth;x.globalAlpha=a;x.drawImage(img,120-w/2,120-h/2,w,h);x.globalAlpha=1}
  if(t>7800){P.phase='ball';P.pt=now()}return}
 if(P.phase=='ball'){
  x.fillStyle='#fff';x.fillRect(0,0,240,240);
  var T=t/1000,r=6+Math.pow(T/3.4,2.2)*190,bx=120+Math.sin(T*4.2)*(95-Math.min(r,95)*.5),by=Math.abs(Math.cos(T*3.6))*(1-T/3.6)*180+Math.min(r,120)*.4+10;
  if(T>3.1){bx=120;by=120}
  x.fillStyle='#000';x.beginPath();x.arc(bx,by,r,0,6.3);x.fill();
  if(t>3700){P.phase='roul';P.pt=now()}return}
 if(P.phase=='roul'){
  x.fillStyle='#000';x.fillRect(0,0,240,240);
  var d=2800,pp=1-Math.pow(1-Math.min(t/d,1),3),pos=pp*15,k=Math.floor(pos),fr=pos-k;
  if(k>=15){k=14;fr=1}
  var save=cur.c.slice(),v=V();
  cur.c=F[seq[k]].slice();cur.ga=0;drawFace(v,fr*240,null);
  cur.c=F[seq[k+1]].slice();drawFace(v,fr*240-240,null);
  cur.c=save;
  if(t>d+300){setFace(P.tgt,true);P.phase='run';blinkAt=now()+2500;actAt=now()+rnd(12000,20000);morphAt=now()+rnd(60000,180000);drawRun();}
  return}}
function drawRun(){
 stepCol();var v=compute();x.fillStyle='#000';x.fillRect(0,0,240,240);
 var hue=null;if(act&&act.rb){hue=(now()/6)%360}
 drawFace(v,0,hue);deco(v);smokeDraw();
 var n=now();
 if(S.auto&&!act&&n>actAt){startAct(ri(R.length))}
 if(S.morph&&!S.lock&&!act&&n>morphAt){var nf;do{nf=ri(N)}while(nf==face);smoke=1;smokeT=n;setTimeout(function(){setFace(nf,false)},350);morphAt=n+rnd(60000,180000)}}

function loop(){
 requestAnimationFrame(loop);
 if(!P.on){return}
 tick++;x.setTransform(2,0,0,2,0,0);
 if(P.phase=='run')drawRun();else bootDraw()}

/* ---------- UI ---------- */
var pw=document.getElementById('pw'),hint;
function power(on){
 P.on=on;pw.className=on?'on':'';x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,480,480);
 if(on){boot()}else{P.phase='off'}}
pw.onclick=function(){power(!P.on)};
var pn=document.getElementById('pn'),sh=document.getElementById('sh');
function menu(o){pn.className=o?'open':'';sh.style.display=o?'block':'none'}
document.getElementById('burger').onclick=function(){menu(true)};sh.onclick=function(){menu(false)};
function tg(id,k,cb){var b=document.getElementById(id);b.onclick=function(){S[k]=!S[k];b.className='sw'+(S[k]?' on':'');if(cb)cb()}}
tg('tLock','lock');tg('tAuto','auto');tg('tMorph','morph');
document.getElementById('bBoot').onclick=function(){if(!P.on)power(true);else boot();menu(false)};
var gF=document.getElementById('gF'),sel=null;
R.forEach(function(r,i){var b=document.createElement('button');b.textContent=r.n;b.onclick=function(){if(P.phase!='run'){return}startAct(i);menu(false)};gR.appendChild(b)});
for(var i=0;i<N;i++)(function(i){var b=document.createElement('button'),r=F[i];b.className='f';b.title='Rosto '+(i+1);
 var a='rgb('+r[0]+','+r[1]+','+r[2]+')',c='rgb('+r[6]+','+r[7]+','+r[8]+')';b.style.background='linear-gradient(90deg,'+a+' 50%,'+c+' 50%)';
 b.onclick=function(){if(P.phase!='run')return;if(sel)sel.className='f';b.className='f sel';sel=b;smoke=1;smokeT=now();setFace(i,false)};gF.appendChild(b)})(i);

/* ---------- microfone e camera ---------- */
var st=document.getElementById('st');
function say(t){st.textContent=t}
function fire(nm,force){if(P.phase!='run')return false;if(act&&!force)return false;for(var i=0;i<R.length;i++)if(R[i].n.indexOf(nm)==0){startAct(i);return true}return false}
var AC,an,buf,micOn=false,micS,mbase=6,lastL=0,lastT=0;
function micLoop(){
 if(!micOn)return;setTimeout(micLoop,60);an.getByteTimeDomainData(buf);
 var m=0,i,d;for(i=0;i<buf.length;i++){d=Math.abs(buf[i]-128);if(d>m)m=d}
 var n=now();mbase+=(Math.min(m,30)-mbase)*.02;
 if(m>78){if(n-lastL>150&&n-lastL<850){fire('Cambalhota',true);lastL=0}else{lastL=n;fire('Susto',true)}return}
 if(m>mbase+14&&n-lastT>6000){if(fire('Curioso'))lastT=n}}
function micStart(cb){
 var md=navigator.mediaDevices;if(!md||!md.getUserMedia){cb(false);return}
 md.getUserMedia({audio:true}).then(function(s){micS=s;AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();
  var src=AC.createMediaStreamSource(s);an=AC.createAnalyser();an.fftSize=512;src.connect(an);buf=new Uint8Array(an.fftSize);micOn=true;micLoop();cb(true)}).catch(function(){cb(false)})}
function micStop(){micOn=false;if(micS){micS.getTracks().forEach(function(t){t.stop()})}}
var tm=document.getElementById('tMic');
tm.onclick=function(){if(micOn){micStop();tm.className='sw';say('Microfone desligado');return}
 say('Pedindo permissão do microfone...');micStart(function(ok){tm.className='sw'+(ok?' on':'');say(ok?'Microfone ligado: fale, bata palmas (2 = cambalhota).':'Microfone negado ou indisponível (precisa HTTPS e permissão).')})};
// camera: MediaPipe Hands (carrega da internet; precisa de aparelho recente)
var camOn=false,hands,vd=document.getElementById('vd'),camS,lastG=0;
function ld(src,cb,er){var e=document.createElement('script');e.src=src;e.crossOrigin='anonymous';e.onload=cb;e.onerror=er;document.head.appendChild(e)}
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function ext(L,t,p){return dist(L[t],L[0])>dist(L[p],L[0])*1.08}
function gesture(res){
 var H=res.multiHandLandmarks||[],i;if(!H.length)return '';
 if(H.length==2){var a=H[0],b=H[1];if(dist(a[4],b[4])<.07&&dist(a[8],b[8])<.09)return 'heart'}
 for(i=0;i<H.length;i++){var L=H[i],sc=dist(L[0],L[9]),i1=ext(L,8,6),m1=ext(L,12,10),r1=ext(L,16,14),p1=ext(L,20,18),th=dist(L[4],L[2])>sc*.55;
  if(m1&&!i1&&!r1&&!p1)return 'middle';
  if(dist(L[4],L[8])<sc*.35&&!m1&&!r1&&!p1)return 'heart';
  if(th&&!i1&&!m1&&!r1&&!p1&&L[4].y<L[3].y&&L[4].y<L[0].y-sc*.5)return 'thumb'}
 return ''}
function onHands(res){var g=gesture(res),n=now();if(!g||n-lastG<5000||P.phase!='run')return;lastG=n;
 if(g=='middle')fire('Bravo',true);else if(g=='heart')fire('Apaixonado',true);else if(g=='thumb')fire('Joinha',true)}
function camLoop(){if(!camOn)return;if(vd.readyState>=2){hands.send({image:vd}).then(function(){setTimeout(camLoop,120)},function(){setTimeout(camLoop,500)})}else setTimeout(camLoop,200)}
function camStart(cb){
 var md=navigator.mediaDevices;if(!md||!md.getUserMedia){cb(false);return}
 md.getUserMedia({video:{facingMode:'user',width:320,height:240}}).then(function(s){camS=s;vd.srcObject=s;vd.play();
  ld('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js',function(){
   try{hands=new Hands({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f}});
   hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});hands.onResults(onHands);camOn=true;camLoop();cb(true)}catch(e){cb(false)}},function(){cb(false)})
 }).catch(function(){cb(false)})}
var tc=document.getElementById('tCam');
tc.onclick=function(){if(camOn){camOn=false;if(camS)camS.getTracks().forEach(function(t){t.stop()});tc.className='sw';say('Câmera desligada');return}
 say('Carregando câmera e reconhecimento...');camStart(function(ok){tc.className='sw'+(ok?' on':'');say(ok?'Câmera ligada: dedo do meio = bravo, coração = amor, joinha = feliz.':'Câmera indisponível: negada, sem internet ou aparelho antigo demais.')})};

/* ---------- giroscopio / acelerometro ---------- */
var motOn=false,motT=0;
function onOri(e){var o=window.orientation||0,g;
 if(o==90||o==-90){if(e.beta==null)return;g=cl(e.beta,-70,70)*(o==90?-1:1)}else{if(e.gamma==null)return;g=cl(e.gamma,-70,70)}
 tgT=g}
function onMot(e){var a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 var d=Math.abs(Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)-9.81);if(d>8)DZ=Math.min(1,DZ+d/150)}
function motTick(){
 TR+=(-tgT*.7-TR)*.12;TG+=(tgT/70*9-TG)*.1;DZ*=.985;
 if(DZ>.45&&P.phase=='run'&&(!act||act.n.indexOf('Tontura')!=0))fire('Tontura',true)}
function motReq(cb){
 var D=window.DeviceMotionEvent,O=window.DeviceOrientationEvent;
 if(D&&D.requestPermission){var p=[D.requestPermission()];if(O&&O.requestPermission)p.push(O.requestPermission());
  Promise.all(p).then(function(r){cb(r.every(function(v){return v=='granted'}))},function(){cb(false)})}
 else cb(!!(D||O))}
var tmo=document.getElementById('tMot');
tmo.onclick=function(){
 if(motOn){motOn=false;window.removeEventListener('deviceorientation',onOri);window.removeEventListener('devicemotion',onMot);clearInterval(motT);tgT=0;DZ=0;TR=0;TG=0;tmo.className='sw';say('Giroscópio desligado');return}
 motReq(function(ok){if(!ok){say('Sensores negados ou indisponíveis neste aparelho.');return}
  motOn=true;window.addEventListener('deviceorientation',onOri);window.addEventListener('devicemotion',onMot);motT=setInterval(motTick,33);tmo.className='sw on';say('Giroscópio ligado: incline o celular e balance para ele ficar tonto.')})};
setFace(0,true);
x.fillStyle='#000';x.fillRect(0,0,480,480);
loop();
power(true);
})();
